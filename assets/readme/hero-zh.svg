<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#0D2E57"/>
      <stop offset="100%" stop-color="#0A4A7A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="38" y1="28" x2="92" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A9EFF"/>
      <stop offset="1" stop-color="#0B57D0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AB4F8"/>
      <stop offset="1" stop-color="#C2E7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.06" stroke="#C2E7FF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="350" y1="0" x2="350" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="950" y1="0" x2="950" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- Floating dots (circuit motif) -->
  <g fill="#8AB4F8" opacity="0.4">
    <circle cx="100" cy="60" r="3"/>
    <circle cx="200" cy="130" r="2"/>
    <circle cx="1080" cy="100" r="3"/>
    <circle cx="1130" cy="220" r="2"/>
    <circle cx="60" cy="350" r="2"/>
    <circle cx="1140" cy="360" r="3"/>
  </g>

  <!-- Left: Shield icon (large, glowing) -->
  <g transform="translate(130, 110)" filter="url(#glow)">
    <svg width="200" height="200" viewBox="0 0 128 128">
      <path d="M64 24 94 36v23.5c0 24.2-14 38.8-30 46.5-16-7.7-30-22.3-30-46.5V36l30-12Z" fill="url(#shieldGrad)" filter="url(#softShadow)"/>
      <path d="M64 34 84 42v16.5c0 15.8-8.4 26.1-20 32.5-11.6-6.4-20-16.7-20-32.5V42l20-8Z" fill="#C2E7FF" opacity="0.3"/>
      <circle cx="64" cy="58" r="9" fill="#FFFFFF"/>
      <path d="M60.5 64h7l2.3 18.5H58.2L60.5 64Z" fill="#FFFFFF"/>
    </svg>
  </g>

  <!-- Right: Title + description -->
  <g transform="translate(400, 120)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#1A5FB4" opacity="0.6" stroke="#4A9EFF" stroke-width="1"/>
    <text x="70" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#C2E7FF" letter-spacing="0.5">
      浏览器扩展 · v0.2.2
    </text>

    <!-- Main title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">
      Monica KeePass
    </text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="500" fill="#8AB4F8">
      本地优先的 Chrome / Edge 密码库
    </text>

    <!-- Divider -->
    <rect x="0" y="128" width="60" height="3" rx="1.5" fill="url(#accentGrad)"/>

    <!-- Description line 1 -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#D2E3FC">
      保留 KeePass 本地加密习惯，补充浏览器自动填充、
    </text>
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="16" fill="#D2E3FC">
      Windows Hello 解锁、强密码生成与 OneDrive 同步。
    </text>

    <!-- Feature pills -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="115" height="32" rx="16" fill="#0D3B66" stroke="#1E60A8" stroke-width="1"/>
      <text x="57.5" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#AECBFA">🔐 KeePass .kdbx</text>

      <rect x="125" y="0" width="130" height="32" rx="16" fill="#0D3B66" stroke="#1E60A8" stroke-width="1"/>
      <text x="190" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#AECBFA">👋 Windows Hello</text>

      <rect x="265" y="0" width="130" height="32" rx="16" fill="#0D3B66" stroke="#1E60A8" stroke-width="1"/>
      <text x="330" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#AECBFA">☁️ OneDrive 同步</text>

      <rect x="405" y="0" width="110" height="32" rx="16" fill="#0D3B66" stroke="#1E60A8" stroke-width="1"/>
      <text x="460" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#AECBFA">⚡ 自动填充</text>
    </g>
  </g>
</svg>
