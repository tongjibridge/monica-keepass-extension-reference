name: Build browser extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run compile

      - name: Run harness tests
        run: pnpm run test:harness

      - name: Package extension
        run: pnpm run zip

      - name: Build CRX package
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p artifacts
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            echo "CRX_PRIVATE_KEY_BASE64 is required for tagged releases." >&2
            exit 1
          fi
          if [[ -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            export CRX_ALLOW_EPHEMERAL=1
          fi
          pnpm run crx

      - name: Collect package
        run: |
          mkdir -p artifacts
          cp .output/*.zip artifacts/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: monica-keepass-extension-chrome
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
